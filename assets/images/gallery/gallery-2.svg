    <ellipse cx="360" cy="440" rx="8" ry="20"/><ellipse cx="840" cy="450" rx="8" ry="20"/>
    <ellipse cx="910" cy="440" rx="8" ry="20"/><ellipse cx="980" cy="445" rx="8" ry="20"/>
    <ellipse cx="1050" cy="452" rx="8" ry="20"/><ellipse cx="1120" cy="442" rx="8" ry="20"/>
