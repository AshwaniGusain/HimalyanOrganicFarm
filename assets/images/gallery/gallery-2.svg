  <path d="M0 320 L200 140 L370 250 L540 100 L720 220 L900 80 L1080 200 L1200 120 L1200 450 L0 450Z" fill="#4a6a5a" opacity="0.6"/>
  <path d="M540 100 L580 133 L500 131Z" fill="#ffe8c8" opacity="0.7"/>
  <path d="M900 80 L942 114 L860 112Z" fill="#ffe8c8" opacity="0.75"/>
