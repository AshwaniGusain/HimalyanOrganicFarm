  <line x1="680" y1="503" x2="635" y2="555" stroke="#4a70c0" stroke-width="12" stroke-linecap="round"/>
  <line x1="680" y1="503" x2="728" y2="543" stroke="#4a70c0" stroke-width="12" stroke-linecap="round"/>
  <rect x="667" y="575" width="14" height="32" fill="#8b5020" rx="4"/>
  <rect x="689" y="575" width="14" height="32" fill="#8b5020" rx="4"/>
