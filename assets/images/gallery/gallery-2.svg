  <rect x="30" y="30" width="460" height="76" rx="12" fill="rgba(27,67,50,0.88)"/>
  <text x="260" y="65" text-anchor="middle" fill="#f9c784" font-size="22" font-family="Georgia, serif" font-weight="bold">Women-Led Harvest Communities</text>
  <text x="260" y="91" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="14" font-family="sans-serif">Empowering 5000+ women farmers across Uttarakhand</text>
