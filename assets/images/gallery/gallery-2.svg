<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Women farmers harvesting millets in Himalayas">
  <defs>
    <linearGradient id="gsky2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0d89a"/>
      <stop offset="50%" stop-color="#f4b860"/>
      <stop offset="100%" stop-color="#c87a30"/>
    </linearGradient>
    <linearGradient id="gground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5a9640"/>
      <stop offset="100%" stop-color="#2d6a20"/>
    </linearGradient>
  </defs>
  <!-- Golden hour sky -->
  <rect width="1200" height="800" fill="url(#gsky2)"/>
