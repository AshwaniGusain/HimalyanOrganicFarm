  <circle cx="760" cy="480" r="28" fill="#e8a070"/>
  <rect x="734" y="508" width="52" height="72" fill="#2d6a4f" rx="6"/>
  <ellipse cx="760" cy="468" rx="30" ry="12" fill="#f0c030" opacity="0.9"/>
  <line x1="760" y1="508" x2="715" y2="558" stroke="#2d6a4f" stroke-width="12" stroke-linecap="round"/>
  <line x1="760" y1="508" x2="808" y2="545" stroke="#2d6a4f" stroke-width="12" stroke-linecap="round"/>
  <rect x="747" y="580" width="14" height="32" fill="#8b5020" rx="4"/>
