  <circle cx="440" cy="480" r="28" fill="#e8a070"/>
  <rect x="414" y="508" width="52" height="72" fill="#c03a6a" rx="6"/>
  <ellipse cx="440" cy="468" rx="30" ry="12" fill="#e85030" opacity="0.8"/>
  <line x1="440" y1="508" x2="395" y2="560" stroke="#c03a6a" stroke-width="12" stroke-linecap="round"/>
