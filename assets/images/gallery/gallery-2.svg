    <line x1="220" y1="705" x2="220" y2="445"/><line x1="290" y1="700" x2="290" y2="450"/>
    <line x1="360" y1="710" x2="360" y2="440"/><line x1="840" y1="700" x2="840" y2="450"/>
    <line x1="910" y1="710" x2="910" y2="440"/><line x1="980" y1="705" x2="980" y2="445"/>
    <line x1="1050" y1="700" x2="1050" y2="452"/><line x1="1120" y1="708" x2="1120" y2="442"/>
  </g>
  <!-- Millet heads -->
