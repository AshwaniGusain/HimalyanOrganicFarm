<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Finger millet ragi grains organic">
  <defs>
    <linearGradient id="bg1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#e8dac8"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c0894a"/>
      <stop offset="100%" stop-color="#8b5e2a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="650" fill="url(#bg1)"/>
  <!-- Stone bowl -->
  <ellipse cx="450" cy="430" rx="310" ry="150" fill="#c8a060" opacity="0.4"/>
  <ellipse cx="450" cy="420" rx="295" ry="140" fill="url(#bowl)"/>
  <ellipse cx="450" cy="400" rx="270" ry="120" fill="#9c6830"/>
  <!-- Grains fill -->
  <ellipse cx="450" cy="388" rx="250" ry="105" fill="#7a4520"/>
  <!-- Individual grain dots - finger millet dark red-brown -->
  <g fill="#5c2d0e">
    <circle cx="310" cy="395" r="14"/><circle cx="345" cy="375" r="13"/>
    <circle cx="385" cy="390" r="15"/><circle cx="420" cy="372" r="13"/>
    <circle cx="455" cy="386" r="14"/><circle cx="490" cy="370" r="13"/>
    <circle cx="525" cy="385" r="15"/><circle cx="558" cy="375" r="14"/>
    <circle cx="592" cy="392" r="13"/>
    <circle cx="330" cy="415" r="13"/><circle cx="365" cy="406" r="14"/>
    <circle cx="400" cy="412" r="13"/><circle cx="440" cy="405" r="14"/>
    <circle cx="475" cy="410" r="13"/><circle cx="510" cy="406" r="15"/>
    <circle cx="548" cy="410" r="14"/><circle cx="570" cy="415" r="13"/>
  </g>
  <g fill="#8b3a10">
    <circle cx="326" cy="382" r="11"/><circle cx="362" cy="362" r="10"/>
    <circle cx="408" cy="378" r="12"/><circle cx="468" cy="360" r="10"/>
    <circle cx="508" cy="374" r="11"/><circle cx="538" cy="365" r="10"/>
    <circle cx="575" cy="378" r="12"/>
  </g>
  <!-- Millet sprig decoration -->
  <line x1="450" y1="200" x2="450" y2="310" stroke="#2d6a4f" stroke-width="5"/>
  <line x1="450" y1="230" x2="420" y2="260" stroke="#2d6a4f" stroke-width="4"/>
  <line x1="450" y1="250" x2="480" y2="280" stroke="#2d6a4f" stroke-width="4"/>
  <line x1="450" y1="270" x2="415" y2="300" stroke="#2d6a4f" stroke-width="4"/>
  <g fill="#7a4520">
    <ellipse cx="420" cy="260" rx="8" ry="5" transform="rotate(-30 420 260)"/>
    <ellipse cx="480" cy="280" rx="8" ry="5" transform="rotate(30 480 280)"/>
    <ellipse cx="415" cy="300" rx="8" ry="5" transform="rotate(-25 415 300)"/>
    <ellipse cx="450" cy="200" rx="10" ry="6"/>
  </g>
  <!-- Label -->
  <rect x="40" y="50" width="380" height="80" rx="12" fill="rgba(27,67,50,0.88)"/>
  <text x="230" y="85" text-anchor="middle" fill="#f9c784" font-size="26" font-family="Georgia, serif" font-weight="bold">Finger Millet (Ragi)</text>
  <text x="230" y="113" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="15" font-family="sans-serif">Himalayan Organic Export Grade</text>
  <!-- Badge -->
  <circle cx="820" cy="110" r="58" fill="#2d6a4f"/>
  <circle cx="820" cy="110" r="50" fill="none" stroke="#d4a843" stroke-width="2"/>
  <text x="820" y="103" text-anchor="middle" fill="#f9c784" font-size="13" font-family="sans-serif" font-weight="bold">100%</text>
  <text x="820" y="120" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">ORGANIC</text>
  <text x="820" y="136" text-anchor="middle" fill="#d4a843" font-size="10" font-family="sans-serif">BULK GRADE</text>
</svg>
